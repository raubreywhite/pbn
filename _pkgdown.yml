url: https://www.rwhite.no/pbn/

template:
  package: rwtemplate
  params:
    hero:
      overline: "R package - Project policy"
      title: "One layout for every analysis project."
      lede: >
        The house layout of a versioned analysis project, the checks of that
        layout, and one results object with a fixed contract.
      cta:
        primary:
          text: "Get started"
          href: "articles/pbn.html"
        secondary:
          text: "Browse the reference"
          href: "reference/index.html"

reference:
- title: "Run a project version"
  contents:
    - initialize_project
    - use_scenario
    - end_if_fake_scenario
    - run_scenarios

- title: "Results"
  contents:
    - save_results
    - read_results
    - check_results

- title: "Checks of the layout"
  contents:
    - check_project

- title: "Shared helpers"
  contents:
    - table1

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  Richard Aubrey White:
    href: "https://www.rwhite.no"
