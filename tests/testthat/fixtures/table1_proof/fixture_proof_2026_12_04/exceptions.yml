# TEST FIXTURE of pbn. One exception of each of the four rules. Each one is a
# cell whose two shapes differ. reference_1, row 2, column "Group B (n = 10)"
# prints 4 (45.0%), where 4 / 10 is 40.0%. That arithmetic error has the
# shape of the style, so it is no exception.
exceptions:
  - reference: reference_2
    row: 3
    column: 'Cases (n = 8)'
    printed: '(29.5-34.2)'
    style: '31.5 (29.5-34.2)'
    rule: published_error
    source: 'The cell prints two numbers, 29.5 and 34.2, and no median. The cell of the controls in the same row prints 30.5 (27.8-34.5), a median and then its quartiles.'
    justification: 'The printed cell lacks its median, so the style gives the median and the quartiles.'
  - reference: reference_1
    row: 4
    column: 'P'
    printed: '0.512'
    style: ''
    rule: not_computable
    source: '?pbn::table1, Details: p of a "cont" variable is NA, so its P cell is empty.'
    justification: 'The reference prints a P for age, and table1() has no test of a "cont" variable.'
  - reference: reference_1
    row: 5
    column: 'P'
    printed: '0.62'
    style: '0.621'
    rule: guideline
    source: 'Fixture guide for authors, p. 4: a P value has three decimals.'
    justification: 'The reference prints two decimals, and the guideline asks for three.'
  - reference: reference_2
    row: 2
    column: 'P value'
    printed: '<.001'
    style: '<0.001'
    rule: other_reference
    source: 'reference_1, row 3, column "P" prints "<0.001", with the zero before the decimal point.'
    justification: 'The two references write a small P in two ways, and the style follows reference_1.'
