    source: 'The cell prints the quartiles 1.0 and 1.1 and no median. Liao Table 1, note: "Data presented as median [1st-3rd quartile] or n (%)". reference_2, row 37, column "INR ≤1.5 (N = 489), No FFP Administered (N = 309)" prints the median: "1.0 [1.0–1.1]".'
    justification: 'The median is missing from the printed cell. The fake data take the median 1.0, the one printed in this row. The style prints it with no decimals (cont.median_digits), so it gives "1 [1–1]".'
