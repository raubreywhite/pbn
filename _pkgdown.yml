url: https://www.rwhite.no/pbn/

template:
  package: rwtemplate
  params:
    hero:
      overline: "R package - Project policy"
      title: "One layout for every analysis project."
      lede: >
        The house layout of a versioned analysis project, the checks of that
        layout, and one results object with a fixed contract.
      cta:
        primary:
          text: "Get started"
          href: "articles/pbn.html"
        secondary:
          text: "Browse the reference"
          href: "reference/index.html"

articles:
- title: "Articles"
  navbar: ~
  contents:
  - pbn
  - articles/agents

reference:
- title: "Run a project version"
  contents:
    - initialize_project
    - folder
    - scenarios
    - end_unless_real

- title: "The plan"
  contents:
    - add_data
    - cohort_data
    - add_analyses
    - run_plan
    - progress
    - get_data

- title: "Results"
  contents:
    - save_results
    - read_results
    - check_results
    - render_run

- title: "Checks of fake scenarios"
  contents:
    - expect_recovers
    - expect_biased

- title: "Output"
  contents:
    - make_outputs
    - stamp_fake

- title: "Running on an air-gapped server"
  contents:
    - to_one_file
    - check_one_file
    - show_blocks

- title: "Checks of the layout"
  contents:
    - check_project

- title: "Shared helpers"
  contents:
    - table1

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  Richard Aubrey White:
    href: "https://www.rwhite.no"
