url: https://www.rwhite.no/pbn/

template:
  package: rwtemplate
  params:
    hero:
      overline: "R package: analysis framework"
      title: "An R analysis framework built for AI agents."
      lede: >
        One layout, rules that code enforces, and fake data with known
        answers. An AI agent checks its own code with pbn::verify(), and
        each problem comes with its fix.
      cta:
        primary:
          text: "Get started"
          href: "articles/pbn.html"
        secondary:
          text: "pbn with AI agents"
          href: "articles/agents.html"

articles:
- title: "Articles"
  navbar: ~
  contents:
  - pbn
  - articles/agents
  - articles/table1

reference:
- title: "Start a project or a version"
  contents:
    - create_project
    - new_version

- title: "Run a project version"
  contents:
    - initialize_project
    - folder
    - scenarios
    - end_unless_real

- title: "The plan"
  contents:
    - add_data
    - cohort_data
    - add_analyses
    - run_plan
    - progress
    - get_data

- title: "Results"
  contents:
    - save_results
    - read_results
    - check_results
    - render_run
    - update_blocks

- title: "Checks of fake scenarios"
  contents:
    - expect_recovers
    - expect_biased

- title: "Output"
  contents:
    - make_outputs
    - stamp_fake
    - block
    - txt
    - make_checklists

- title: "Running on an air-gapped server"
  contents:
    - to_one_file
    - check_one_file
    - show_blocks
    - export_blocks

- title: "Checks of the layout"
  contents:
    - check_project
    - verify
    - freeze_version

- title: "Shared helpers"
  contents:
    - table1
    - table1_styles

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  Richard Aubrey White:
    href: "https://www.rwhite.no"
