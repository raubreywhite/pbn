# The cells of TABLE1/reference_<k>.csv that differ from the style TABLE1.yml.
# Made by TABLE1-build/gen_exceptions.R of IJOA guide v004 from the output of
# pbn:::style_proof(); rule, source and justification follow ?pbn::table1,
# section Styles, subsection The proof of a style.
exceptions:
  - reference: reference_1
    row: 26
    column: 'P value'
    printed: '>0.999'
    style: '0.976'
    rule: other_reference
    source: 'reference_2, row 30, column "p-value*": "0.112" is Pearson''s chi-squared test without continuity correction of 72 of 309 against 31 of 180. With the correction it is 0.140.'
    justification: 'Maciejewska used R (Statistical analysis, p. 2). Its chisq.test() applies a continuity correction to a 2 by 2 table by default, and gives 1.0000 here, printed ">0.999". Liao and table1() use no correction, which gives 0.9756.'
  - reference: reference_2
    row: 22
    column: 'Total (N = 530)'
    printed: '38.0 [36.0–39.4]'
    style: '38 [36–39]'
    rule: not_computable
    source: '?pbn::table1, Styles: cont.median_digits gives the decimals of the median and the quartiles of every "cont" variable.'
    justification: 'table1() prints every numeric variable with the same decimals. The style takes none, as Liao prints age (reference_2, row 1), and Liao prints one decimal for Gestational age (wk). So "38.0 [36.0–39.4]" becomes "38 [36–39]".'
  - reference: reference_2
