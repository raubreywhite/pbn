# Table 1 style: an observational study as a Brief Report in the International Journal of Obstetric Anesthesia (IJOA).
# Schema: ?pbn::table1, section Styles.
# "Guide" is the IJOA Guide for Authors saved on 2026-11-20, reference/guidelines/ijoa-guide-for-authors-2026-11-20.pdf, cited by page.
# McPeake and Liao are the two exemplars, Table 1 of each. WORDCOUNTS.md, "Table 1 count cells", holds the cell counts.
# GUIDE.md section 6 lists the Guide rules for tables that this schema cannot hold, and the statistics that table1() cannot compute.
bin:
  template:
    value: '{events} ({pct}%)'
    source: '2/2 papers write most count cells of Table 1 as a count with its percentage and the % sign in parentheses: McPeake 28 of 31 count cells, such as "48 (64.0%)"; Liao 100 of 108, such as "77 (14.5%)" (WORDCOUNTS.md). McPeake writes "8 (10.8)" with no % sign. Liao writes a zero count as "0" or "0 (0%)". The guide sets no cell format.'
  pct_digits:
    value: 1
    source: '2/2 papers give one decimal in most count cells of Table 1, the same 28 of 31 (McPeake) and 100 of 108 (Liao) cells (WORDCOUNTS.md). McPeake gives none in "57 (76%)" and "18 (24%)". Liao gives none in "0 (0%)". The guide sets no decimals for a percentage.'
cont:
  template:
    value: '{mean} ({sd})'
    source: 'editorial choice. 0/2 papers give a mean and SD in Table 1. McPeake and Liao give a median with an interquartile range, which table1() does not compute (GUIDE.md section 6). The guide sets no cell format.'
  mean_digits:
    value: 1
    source: 'editorial choice. The guide sets no decimals for a mean, and 0/2 papers report a mean in Table 1.'
  sd_digits:
    value: 1
    source: 'editorial choice. The guide sets no decimals for an SD, and 0/2 papers report an SD in Table 1.'
p:
  digits:
    value: 3
    source: 'Guide p. 28: P values "should be exact and reported to three decimals". 1/2 papers have P values in Table 1: Liao gives three decimals, "0.160". McPeake Table 1 has one group and no P value.'
  template:
    value: 'P ={p}'
    source: 'Guide p. 28: "use space between P and symbol, but not space between symbol and value" and "(e.g. P =0.005)". Liao Table 1 gives the number alone under the heading "p-value*". The guide wins (rule 13 of the methods README prompt).'
  lower:
    value: 0.001
    source: 'Guide p. 28: "use P <0.001", and three decimals "unless P <0.001 or P >0.999". Liao Tables 2 and 3 write "<0.0001". The guide wins.'
  below_template:
    value: 'P <{lower}'
    source: 'Guide p. 28: "use P <0.001 (not p less than)". The same rule puts a space between P and the symbol, and none after the symbol.'
  upper:
    value: 0.999
    source: 'Guide p. 28: three decimals "unless P <0.001 or P >0.999". Liao Table 1 writes "1.000" in three rows. The guide wins.'
  above_template:
    value: 'P >{upper}'
    source: 'Guide p. 28: "P >0.999", with the spacing of the P rule on the same page.'
thousands:
  mark:
    value: ','
    source: 'Guide p. 28: "For large numbers in manuscript, Tables and Figures: use a comma" (e.g. 12,347).'
  from:
    value: 10000
    source: 'Guide p. 28: a comma "for numbers larger than nine thousand nine hundred and ninety-nine". No comma below 10,000 is an editorial reading of that rule (SUBMISSION.md rows 7.6a and 7.6b). Liao Table 2 writes "2000" and "3000" with no comma, which agrees. Liao Results writes "3,827" with a comma, which does not. McPeake Table 1 has no number above 999. The guide wins.'
missing:
  show:
    value: if_any
    source: 'editorial choice, after STROBE item 14b. 0/2 papers add a missing count to a cell. McPeake Table 1 gives a "Missing" row under Ethnicity. Liao Table 1 gives "Declined" and "Unavailable" rows under Race and Ethnicity. The guide sets no rule for missing data in a table.'
  template:
    value: '; {missing} missing'
    source: 'editorial choice. The guide and 0/2 papers give no text for a missing count in a cell.'
footnotes:
  - value: 'Values are n (%) or mean (SD).'
    source: '1/2 papers state the cell format in a table note: Liao Table 1 "Data presented as median [1st-3rd quartile] or n (%)". McPeake gives it in the row labels, "Age, years (median, IQR)". The wording here is an editorial choice that matches the bin and cont templates.'
  - value: 'SD, standard deviation.'
    source: 'Guide p. 27: "All abbreviations used in Tables and Figures should be defined in the legend (even if already defined in the text)". The style defines SD, the one abbreviation of its own templates. The other abbreviations of a table depend on its variables, so they are defined by hand. 1/2 papers define the abbreviations of Table 1 in a note: Liao Table 1. McPeake Table 1 does not define SIMD or IQR.'
  - value: "P values compare the groups with Pearson's chi-square test, or with Fisher's exact test when an expected count is below 5."
    source: 'editorial choice, after STROBE item 12a. The text states what table1() computes for a bin variable (?pbn::table1, Details). 0/2 papers name the test in a table note: Liao Table 1 notes only "*Comparison between no FFP and FFP group, INR ≤ 1.5". The guide sets no rule.'
